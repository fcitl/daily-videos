name: Generate daily vehicle Short

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC — 7h before post-daily.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate but do not queue as a release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system deps (ffmpeg + font for drawtext)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install --quiet -r requirements.txt

      - name: Generate Short
        env:
          YOUTUBE_API_KEY:   ${{ secrets.YOUTUBE_API_KEY }}
          PEXELS_API_KEY:    ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          EDGE_VOICE:        ${{ vars.EDGE_VOICE || 'en-GB-RyanNeural' }}
          BROLL_SOURCE:      ${{ vars.BROLL_SOURCE || 'local' }}
        run: python generate_short.py

      - name: Upload artefacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: |
            out/today.mp4
            out/script.txt
            out/meta.json
            out/voice.mp3
          retention-days: 7

      - name: Queue release for tomorrow
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="queue-$(date -u -d 'tomorrow' +%Y-%m-%d)"
          CAPTION=$(cat out/script.txt)

          gh release delete "$TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" out/today.mp4 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes "$CAPTION"

          echo "Queued as $TAG"
